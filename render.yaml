services:
  - type: web
    name: ghostmail
    env: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DOMAIN
        value: psvrajesh.in
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: ghostmail-data
      mountPath: /var/data
      sizeGB: 1
